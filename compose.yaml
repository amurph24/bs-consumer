services:
  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:-/etc/ssl/certs/server.crt}:/etc/nginx/tls/server.crt:ro
      - ${TLS_KEY_PATH:-/etc/ssl/private/server.key}:/etc/nginx/tls/server.key:ro
    depends_on:
      bs-provisioner:
        condition: service_healthy
    networks:
      - frontend
      - internal

  bs-provisioner:
    image: bs-provisioner:0.1.3
    environment:
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      REDIRECT_URI: ${REDIRECT_URI}
    restart: unless-stopped
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

networks:
  frontend:
  internal:
